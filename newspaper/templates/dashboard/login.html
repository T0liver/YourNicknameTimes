{% extends "base.html" %}
{% block body %}
<form method="post" action="/login">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label>Password <input type="password" name="password" autofocus></label>
  <button type="submit">Sign in</button>
  {% if error %}<p>{{ error }}</p>{% endif %}
</form>
{% endblock %}
