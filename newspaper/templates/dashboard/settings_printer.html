{% extends "_settings_layout.html" %}
{% block settings %}
<form method="post" action="/settings/printer">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label>{{ labels.printer_name }}
    <select name="printer_name">
      <option value="">—</option>
      {% for name in printers %}
      <option value="{{ name }}"{% if settings.printer_name == name %} selected{% endif %}>{{ name }}</option>
      {% endfor %}
    </select>
  </label>
  <label>{{ labels.duplex }}<input type="checkbox" name="duplex" value="on"{% if settings.duplex %} checked{% endif %}></label>
  <button type="submit">{{ labels.save }}</button>
</form>
<form method="post" action="/settings/printer/test"><input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="printer_name" value="{{ settings.printer_name }}"><input type="hidden" name="duplex" value="{% if settings.duplex %}on{% endif %}"><button type="submit">{{ labels.test }}</button></form>
<form method="post" action="/settings/printer/rollback"><input type="hidden" name="csrf" value="{{ csrf }}"><button type="submit">{{ labels.undo }}</button></form>
{% endblock %}
