[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "newspaper"
version = "0.1.0"
description = "One-page A4 morning paper for a Raspberry Pi"
requires-python = ">=3.11"
dependencies = [
    "weasyprint==69.0",
    "Jinja2",
    "pytest",
    "requests",
    "feedparser",
    "caldav",
    "Pillow",
    "astral",
    "fastapi",
    "httpx",
    "python-multipart",
    "uvicorn",
]

[project.scripts]
newspaper-render = "newspaper.render:main"
newspaper-edition = "newspaper.edition_build:main"
newspaper-worker = "newspaper.worker:main"
newspaper-web = "newspaper.web:main"
newspaper-lan-sync = "newspaper.lan:main"

[tool.setuptools.packages.find]
include = ["newspaper*"]

[tool.setuptools.package-data]
newspaper = ["static/**/*", "templates/**/*", "data/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
